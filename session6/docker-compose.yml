version: '3.9'

services:
  php:
    image: php:8.2-fpm
    container_name: php-fpm
    volumes:
      - ./index:/var/www/html
    networks:
      - netnginx

  nginx:
    image: nginx:alpine
    container_name: dockercompose-nginx
    ports:
      - "8881:80"
    volumes:
      - ./index:/var/www/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      - nginx=depi
    depends_on:
      - php
    restart: always
    networks:
      - netnginx

networks:
  netnginx: {}
