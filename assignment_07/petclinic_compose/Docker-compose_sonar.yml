version: "3.8"
services:
  db:
    image: postgres:${POSTGRES_VERSION}
    container_name: meine_petclinic_db_${POSTGRES_STAGE}
    environment:
      POSTGRES_DB: ${SONAR_DB}
      POSTGRES_USER: ${SONAR_USER}
      POSTGRES_PASSWORD: ${SONAR_PASSWORD}
   # ports:
    #  - "5434:5432"
    volumes:
      - vol1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 30s
    networks:
      - abduu1
  sonarqube:
    image: sonarqube:community
    container_name: meine_sonarqube_${POSTGRES_STAGE}
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SONAR_JDBC_USERNAME: ${POSTGRES_USER}
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy   
    ports:
      - "9000:9000"
    networks:
      - abduu1 
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
volumes:
  sonarqube_data: 
  sonarqube_extensions:
  sonarqube_logs:
networks:
  abduu1:
    