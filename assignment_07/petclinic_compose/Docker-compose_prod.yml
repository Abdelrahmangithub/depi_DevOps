version: '3.8'

services:
  db:
    #restart: on-failure

  app:
    #restart: always
    ports: #8080 not available so choose another port like 9999
      - "9999:9966"  
    volumes:
      - vol1_prod:/app/data
    healthcheck:
      #test: ["CMD-SHELL", "curl -f http://localhost:9966 || exit 1"]
      test: ["CMD", "nc", "-z", "localhost", "9966"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 50s
  nginx:
    image: nginx:latest
    container_name: nginx_prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
    - ./nginx/conf.d/nginx.conf:/etc/nginx/nginx.conf:ro
    - ./certs/nginx.crt:/etc/nginx/certs/nginx.crt:ro
    - ./certs/nginx.key:/etc/nginx/certs/nginx.key:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - abduu1
  #certbot:
   # image: certbot/certbot:latest
    #container_name: meine_petclinic_certbot_${POSTGRES_STAGE}
    #volumes:
     # - ./certbot/conf:/etc/letsencrypt
     # - ./certbot/www:/var/www/certbot
    #command: certonly --webroot --webroot-path=/var/www/certbot --email ${CERTBOT_EMAIL} --agree-tos --no-eff-email -d ${DOMAIN}
    #depends_on:
     # - nginx
    #networks:
     # - abduu1
  prometheus:
    image: prom/prometheus
    container_name: meine_petclinic_prometheus_${POSTGRES_STAGE}
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - abduu1
  grafana:
    image: grafana/grafana
    container_name: meine_petclinic_grafana_${POSTGRES_STAGE}
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - abduu1
 # nexus:
  #  ports:
   #   - "8081:8081"

volumes:
  vol1_prod:
